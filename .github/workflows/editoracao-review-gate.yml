name: Editoracao Review Gate

on:
  push:
    branches:
      - editoracao
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr-to-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR from editoracao to deploy exists
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'editoracao';
            const base = 'deploy';

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base
            });

            if (existing.data.length > 0) {
              core.info(`PR ja existe: #${existing.data[0].number}`);
              return;
            }

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title: 'Revisao de conteudo: editoracao -> deploy',
              body: [
                'PR automatizado para promover alteracoes editoriais da branch `editoracao` para `deploy`.',
                '',
                'Fluxo esperado:',
                '1. Edicao via Decap CMS (commits em `editoracao`).',
                '2. Revisao e aprovacao por terceiro neste PR.',
                '3. Merge para atualizar `deploy`.'
              ].join('\n')
            });

            core.info(`PR criado: #${pr.data.number}`);
