backend:
  name: github
  repo: PNP-CCV/guiapnp
  branch: editoracao
  # O GitHub Pages e estatico: o login do backend `github` depende de um
  # provedor OAuth externo que troque o `code` pelo `access_token`. O provedor
  # deste repositorio esta em ../../oauth-proxy (Cloudflare Worker); o deploy
  # dele imprime a URL que entra em `base_url`.
  # Sem as duas linhas abaixo preenchidas, o /admin publicado abre mas o login
  # nunca conclui. Elas ficam dentro de `backend:` de proposito — no nivel raiz
  # sao silenciosamente ignoradas.
  # base_url: https://guiapnp-cms-oauth.SUA-CONTA.workers.dev
  # auth_endpoint: auth

# Permite testar o CMS localmente sem OAuth remoto (so vale em localhost).
local_backend: true

# Rascunho no CMS: cada edicao vira uma branch `cms/<colecao>/<slug>` e um PR
# contra `editoracao`, onde acontece a revisao de terceiro. Depois do merge, o
# workflow editoracao-review-gate abre o PR de promocao para `deploy`.
publish_mode: editorial_workflow

editor:
  preview: true

# As duas linhas precisam apontar para o mesmo diretorio: o upload grava em
# `media_folder` e o markdown gerado referencia `public_folder`. Uma pasta
# dedicada tambem evita que a biblioteca de midia liste as centenas de imagens
# ja versionadas em docs/assets/img.
media_folder: docs/assets/img/uploads
public_folder: /guiapnp/assets/img/uploads

site_url: https://pnp-ccv.github.io/guiapnp
display_url: https://pnp-ccv.github.io/guiapnp
show_preview_links: true

collections:
  - name: ccv
    label: Documentacao - CCV
    label_singular: Pagina
    folder: docs/documentacao/ccv
    create: false
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    preview_path: /documentacao/ccv/{{slug}}
    sortable_fields: [title]
    view_filters:
      - { label: TOC ativo, field: toc, pattern: true }
      - { label: TOC inativo, field: toc, pattern: false }
    fields:
      - { label: Layout, name: layout, widget: string, required: false, default: default }
      - { label: Titulo, name: title, widget: string, required: false }
      - { label: TOC, name: toc, widget: boolean, required: false, default: false }
      - { label: Conteudo, name: body, widget: markdown, modes: ['raw'] }

