backend:
  name: github
  repo: PNP-CCV/guiapnp
  branch: editoracao

# Para producao com login GitHub, configure um provedor OAuth do Decap CMS
# e descomente as linhas abaixo:
# base_url: https://seu-oauth-provider.exemplo.com
# auth_endpoint: auth

# Permite testar o CMS localmente sem OAuth remoto.
local_backend: true

publish_mode: editorial_workflow

editor:
  preview: true

media_folder: docs/assets/img
public_folder: /guiapnp/assets/img/uploads

site_url: http://127.0.0.1:4000/guiapnp
display_url: http://127.0.0.1:4000/guiapnp
show_preview_links: true

collections:
  - name: ccv
    label: Documentacao - CCV
    label_singular: Pagina
    folder: docs/documentacao/ccv
    create: false
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    preview_path: /documentacao/ccv/{{slug}}
    sortable_fields: [title]
    view_filters:
      - { label: TOC ativo, field: toc, pattern: true }
      - { label: TOC inativo, field: toc, pattern: false }
    fields:
      - { label: Layout, name: layout, widget: string, required: false, default: default }
      - { label: Titulo, name: title, widget: string, required: false }
      - { label: TOC, name: toc, widget: boolean, required: false, default: false }
      - { label: Conteudo, name: body, widget: markdown }

